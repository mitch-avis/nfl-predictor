  - id: qb-season-mirrors-game-logs
    kinds: [qb_per_game_stats, qb_combined]
    columns: [qb_completion_pct, qb_pass_yards_per_dropback, qb_td_int_margin_rate]
    class: different
    mirror_kind: qb_game_logs
    note: >-
      There the season's rate; here only the game rate its game-log column names, from the
      passer's per-game totals, and no season or career value.
  - id: qb-season-totals
    kinds: [qb_per_game_stats, qb_combined]
    columns: [qb_attempts_per_game, qb_attempts_total, qb_completions_per_game, qb_completions_total, qb_dropbacks_per_game, qb_interceptions_per_game, qb_interceptions_total, qb_pass_touchdowns_per_game, qb_pass_touchdowns_total, qb_pass_yards_per_game, qb_pass_yards_total, qb_passing_epa_per_game, qb_passing_epa_total, qb_sack_yards_lost_per_game, qb_sack_yards_lost_total, qb_sacks_per_game, qb_sacks_total]
    class: different
    mirror_kind: qb_game_logs
    mirror_base: true
    note: >-
      There a season total or per-game average of a quarterback game-log column; here only the
      passer's per-game total its base metric's game-log column names (the career rates sum
      several of them), never a season value.
  - id: qb-season-rest
    expect: 112
    kinds: [qb_per_game_stats, qb_combined]
    rest: true
    class: matched
    here: ratings:{column}
    note: >-
      Quarterback season stats, totals and per-game values its pages show, written only by the
      ported season statistics.
  - id: qb-opponents
    expect: 102
    kinds: [qb_opponent_profiles, qb_combined]
    prefix: qopp_
    class: matched
    here: ratings:{column}
    note: The defenses each quarterback faced, written only by the ported season statistics.
  - id: qb-ratings
    kinds: [qb_combined, qb_ratings, qb_ratings_by_week]
    columns: [adj_qb_epa_per_dropback]
    class: different
    here: dataset:ratings_qb
    note: >-
      The ported quarterback rating: EPA per dropback adjusted for the defenses faced, the
      published tables equal to its files (RATINGS_PARITY.md). The model's feature is the same
      fit on the passer-games before each week with the previous season's penalty, where the
      published history uses the season's own, so the two differ slightly (ratings/pre_week.py).
  - id: qb-faced-defense
    kinds: [qb_combined, qb_ratings]
    columns: [qb_faced_pass_defense]
    class: matched
    here: ratings:{column}
    note: The average adjusted pass defense a quarterback faced, written only by the ported tables.
  - id: qb-ratings-plays
    kinds: [qb_ratings, qb_ratings_by_week]
    columns: [qb_attempts_total, qb_dropbacks]
    expect: 2
    class: different
    mirror_kind: qb_game_logs
    mirror_base: true
    note: >-
      The attempts or dropbacks behind each rating, as in the ported tables; the model's
      quarterback games keep only the passer's per-game totals.
  - id: qb-ratings-volume
    kinds: [qb_ratings, qb_ratings_by_week]
    columns: [qb_games_played]
    class: matched
    here: ratings:{column}
    note: The games behind each rating, written only by the ported tables.

  # --- Rank ranges, pairs, histories, the prior, win-probability bins --------------------------
  - id: ratings-volume
    kinds: [ratings, ratings_by_week]
    columns: [games_played]
    class: different
    here: strength:strength_games_played
    note: >-
      There games through the season or the week, as in the ported tables; the strength
      snapshot's are the games before the week.
  - id: ratings-history
    kinds: [ratings_by_week]
    columns: [offense_rating, defense_rating, special_teams_rating, team_rating]
    class: matched
    here_map:
      offense_rating: dataset:ratings_offense
      defense_rating: dataset:ratings_defense
      special_teams_rating: dataset:ratings_special_teams
      team_rating: dataset:ratings_team
    note: >-
      The same weekly fit: a team's rating after week N, as published, is the model's pre-week
      feature on its next game row, from week N + 1 (ratings/pre_week.py: "for a week after the
      first, the ratings of the teams that have played equal the published week-by-week history
      of the week before"). The strength snapshot's own weekly ratings stay beside them.
  - id: rank-ranges
    expect: 115
    kinds: [rating_ranges, rating_pairs, rating_ranges_by_week, qb_rating_ranges, qb_rating_pairs, qb_rating_ranges_by_week]
    rest: true
    class: matched
    here: ratings:{column}
    note: Game-bootstrap rank ranges and head-to-head chances, written only by the ported tables.
  - id: team-prior
    expect: 2
    kinds: [team_prior]
    rest: true
    class: matched
    here: ratings:{column}
    note: >-
      The preseason prior means inside the fit, with each team's head-to-head-excluded refit,
      written only by the ported tables (the model's pre-week ratings fit with the same prior).
  - id: wp-bins
    expect: 7
    kinds: [team_wp_bins, qb_wp_bins]
    rest: true
    class: matched
    here: ratings:{column}
    note: >-
      Plays and EPA by win-probability bin, written by the ported season statistics; no page here
      reads them, since the garbage-time filter view is not ported (decisions/web_pages.md
      entry 9).
