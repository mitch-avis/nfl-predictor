# Hand judgments for inventory.py: how each nfl-sos-ratings data source, output column and web
# item at the frozen commit 9081bce relates to this repository.
#
# inventory.py finds every item itself and applies these rules; it fails when an item matches no
# rule or more than one, when a rule matches nothing, and when a counterpart named here does not
# exist in this repository. Classes:
#   matched   - the same definition here; `here` names it. With several counterparts, every one
#               shares the definition.
#   different - a counterpart here with a different definition; `note` says which and how.
#   missing   - no counterpart here; `phase` says which step-6 phase ports it, or "none planned".
#
# Column rules match on any of: `kinds` (file kinds, or "*"), `columns` (exact names), `match`
# (regular expression on the column), `base` (its registry's base metric), `prefix` and `suffix`
# (its registry's affixes), `source` (the code-derived source for game logs, else its registry's
# label). A `rest: true` rule takes every column of its kinds that no other rule matches, and must
# say how many (`expect`), so a column the frozen commit does not have fails the run; any other
# rule may pin its count the same way. A column left `missing` fails the run when the ported
# tables write it (below), when this repository has a column of the same name (or, for a season
# total or per-game value, of its base metric; opponents-faced profile columns are exempt from
# this guard), or when another file kind gives that name a counterpart, unless
# `cross_kind_exceptions` (keyed `kind.column`) says why. A rule with `mirror_kind` takes each
# column's counterparts from the same column in that kind (`mirror_base`: from its base metric's
# column there), less that column's ported table, and fails when nothing else is left.
# Counterparts are `<catalog>:<column>`, where the catalogs are this repository's
#   ratings    - the table of the column's own kind that the ETL writes to
#                data/ratings/{season}_{kind}.parquet: the ported ratings (nfl_predictor.ratings,
#                utils/polars/ratings_build.py) and season statistics (nfl_predictor.season_stats,
#                utils/polars/season_stats_build.py), each kind and column named as there. The
#                inventory names it first for every matched or different column it writes; a rule
#                names it only when it is the column's one counterpart (`ratings:{column}`).
#   team_game  - aggregate_pbp_team_game_stats (play-by-play, per team-game)
#   box_score  - aggregate_pbp_team_box_score_stats (play-by-play, per team-game; it overrides
#                nflverse's team stats by default, team_stats_source "pbp")
#   team_stats - nflverse weekly team stats as cached (per team-game)
#   qb_game    - aggregate_qb_game_stats (play-by-play, per quarterback-game)
#   dataset    - a published game-dataset column, without its home_/away_ side prefix
#   strength   - the weekly strength snapshot file
# and arithmetic over names of one catalog (`team_game:pass_epa_sum / dropbacks`). `[opponent]`
# after a per-team-game catalog (`box_score[opponent]:rush_attempts`) names the column on the
# opponent's row of the same game. `{column}`,
# `{base}` and `{core}` (the column without its prefix) are filled in per column; in source and
# web rules `{key}` is the item's own key.
#
# The ported tables equal nfl-sos-ratings' published files cell for cell, Washington's code
# apart (SEASON_STATS_ETL_PARITY.md, RATINGS_PARITY.md, ADAPTER_PARITY.md). So a column's class
# turns on this repository's own model inputs where it has them: the play-by-play aggregates the
# ETL builds team-game features from (PARITY.md compares them with its game logs), its team
# stats, the game dataset and the strength snapshot. "Season-to-date" below means this
# repository's pre-game feature: the team's stats through the week before, blended toward the
# previous season (polars_utils.blend_with_prior_stats); "pre-week" a rating fitted on the games
# before the week (ratings/pre_week.py).

# Columns that may stay missing in one kind although another kind gives their name a
# counterpart, each with the reason. None today.
cross_kind_exceptions: {}

sources:
  - id: pbp
    match: 'nflreadpy\.load_pbp'
    class: matched
    here: load:{key}
    note: >-
      Same regular-season play-by-play; there the full frame, here the columns of
      constants.PBP_COLUMNS, which hold every column it reads (qb_scramble, play_id, the play text
      and the player ids included), with the same team codes and Jacksonville's 2001-2002 player
      teams repaired before the aggregates (PARITY.md).
  - id: schedules
    match: 'nflreadpy\.load_schedules'
    class: matched
    here: load:{key}
    note: Same nflverse schedules; there regular season only.
  - id: team-stats
    match: 'nflreadpy\.load_team_stats'
    class: different
    here: load:{key}
    note: >-
      Same weekly team stats. The season statistics read them as it does, as their own cached
      source (season_stats/sources.py, OFFICIAL_TEAM_STATS), dropping a game with one team's row
      (Jacksonville's 2001-2002 home games) and overriding play-by-play with them; the model's
      team-game frame (loaders.load_team_stats) lets play-by-play override them instead.
  - id: player-stats
    match: 'nflreadpy\.load_player_stats'
    class: matched
    here: load:{key}
    note: >-
      Weekly player stats (nflverse_sources.PLAYER_STATS), for the season statistics' defensive
      stats and quarterback totals, with the stats nflverse never charted null as there
      (decisions/sources.md).
  - id: snap-counts
    match: 'nflreadpy\.load_snap_counts'
    class: matched
    here: load:{key}
    note: Snap counts (2012 on, nflverse_sources.SNAP_COUNTS), for quarterback offensive snaps.
  - id: identity
    match: 'nflreadpy\.load_(players|rosters_weekly|rosters)'
    class: matched
    here: load:{key}
    note: >-
      Players and rosters (nflverse_sources), for the quarterback identity (its rule: the players
      file or any roster week of the season) and the player-team repair of one-team games. The
      Elo file's quarterbacks are still bridged through ../nfeloqb's meta_data.csv.
  - id: teams
    match: 'nflreadpy\.load_teams'
    class: missing
    phase: none planned (team palettes are not ported, decisions/web_pages.md entry 13)
    note: Team colors for its pages (team_palettes.py).
  - id: espn-qbr-files
    match: 'url https://github\.com/nflverse/nflverse-data/releases/download/espn_data/qbr_(season|week)_level\.parquet'
    class: matched
    here: load:{key}
    note: >-
      ESPN QBR from the nflverse release assets (utils/polars/espn_qbr.py), a validation
      reference only, as there (decisions/sources.md).
  - id: espn-qbr-fetch
    match: 'network fetch'
    class: matched
    here: load:{key}
    note: >-
      Its one network fetch reads the ESPN QBR files above (data_loader._fetch_release_parquet);
      this repository's fetches include the same read (espn_qbr._download_parquet).

# This app serves the ported pages under one route family, /api/ratings/{season}/{kind}/..., with
# kind teams or qbs (decisions/web_pages.md entry 2), so its team and quarterback routes share one
# counterpart; "web_pages.md entry N" below is an entry of that file.
web:
  - id: game-logs
    match: 'api GET /api/seasons/\{season\}/(teams/\{team\}|qbs/\{qb_id\})/game-logs'
    class: different
    here: api GET /api/ratings/{season}/{kind}/{entity_id}/game-logs
    note: >-
      Team and quarterback game logs; here each game also carries its opponent's season ratings,
      joined on the server, and no rank-range chip (web_pages.md entry 6).
  - id: rating-history
    match: 'api GET /api/seasons/\{season\}/(teams/\{team\}|qbs/\{qb_id\})/rating-history'
    class: different
    here: api GET /api/ratings/{season}/{kind}/{entity_id}/rating-history
    note: Weekly rating histories, under this app's route family (web_pages.md entry 2).
  - id: rank-history
    match: 'api GET /api/seasons/\{season\}/(teams/\{team\}|qbs/\{qb_id\})/rank-history'
    class: different
    here: api GET /api/ratings/{season}/{kind}/{entity_id}/rank-history
    note: Weekly rank histories, under this app's route family (web_pages.md entry 2).
  - id: rating-pairs
    match: 'api GET /api/seasons/\{season\}/(teams/\{team\}|qbs/\{qb_id\})/rating-pairs'
    class: different
    here: api GET /api/ratings/{season}/{kind}/{entity_id}/head-to-head
    note: >-
      Head-to-head chances between two teams or two quarterbacks, renamed (web_pages.md
      entry 2).
  - id: rating-ranges
    match: 'api GET /api/seasons/\{season\}/(teams|qbs)/rating-ranges'
    class: different
    here: api GET /api/ratings/{season}/{kind}/rank-ranges
    note: Rank ranges, under this app's route family (web_pages.md entry 2).
  - id: wp-ratings
    match: 'api GET /api/seasons/\{season\}/(teams|qbs)/wp-ratings'
    class: missing
    phase: none planned (the garbage-time filter view is not ported, web_pages.md entry 9)
    note: Ratings refit with the garbage-time filter (exploration only there).
  - id: refresh
    match: 'api (GET|POST) /api/refresh'
    class: different
    here: api POST /api/jobs
    note: Its refresh button rebuilds the season; this app starts data refreshes as jobs.
  - id: health
    match: 'api GET /api/health'
    class: matched
    here: api GET /api/health
  - id: metadata
    match: 'api GET /api/metadata'
    class: different
    here: api GET /api/ratings/metrics
    note: >-
      Its metric registry, ported (nfl_predictor.season_stats.metrics); here each table maps its
      columns into this app's column format (web_pages.md entry 4) and the glossary leaves out the
      garbage-time filter's 8 metrics (web_pages.md entry 9).
  - id: season-list
    match: 'api GET /api/seasons'
    class: different
    here: api GET /api/ratings/seasons
    note: >-
      The season list; here a season is listed once its two index tables exist (web_pages.md
      entry 3).
  - id: season-dataset
    match: 'api GET /api/seasons/\{season\}'
    class: different
    here: api GET /api/ratings/{season}/{kind}
    note: >-
      One season's whole dataset for its pages; here one table per request, the teams' or the
      quarterbacks' (web_pages.md entry 2).
  - id: layout-route
    match: 'page /'
    class: different
    here: page /
    note: The layout route both apps nest their pages under (its app shell; this app's sign-in guard).
  - id: index-page
    match: 'page / \(index\)'
    class: different
    here: page / (index)
    note: Its index redirects to the teams page; this app's is the dashboard.
  - id: index-pages
    match: 'page /(teams|qbs)'
    class: different
    here: '{key}'
    note: >-
      The team and quarterback tables; here without the rank-range column and the selection bar
      (web_pages.md entries 19 and 20), with search, sort and the qualifier switch reset on
      leaving (entry 21), in this app's sidebar and shading (entries 5 and 14). Power Rankings
      stays beside them (entry 15).
  - id: index-page-component
    match: 'component EntityIndexPage'
    class: different
    here: component Ratings
    note: The index page of both tables, with the differences of its pages above.
  - id: detail-pages
    match: 'page /(teams|qbs)/:entityId'
    class: different
    here: '{key}'
    note: >-
      Team and quarterback detail pages; here the opponents faced are one row per opponent
      (web_pages.md entry 11) and a missing team or quarterback is a message on the page
      (entry 12).
  - id: detail-page-component
    match: 'component EntityDetailPage'
    class: different
    here: component RatingsDetail
    note: The detail page of both kinds, with the differences of its pages above.
  - id: season-data-route
    match: 'component SeasonDataRoute'
    class: different
    here: component RatingsRoutes
    note: >-
      Its route wrapper loads the registry and the whole season before any page; this app's loads
      the ratings pages lazily and each page its own table (web_pages.md entries 2 and 3).
  - id: glossary
    match: 'page /glossary|component GlossaryPage'
    class: different
    here: [page /glossary, component Glossary]
    note: >-
      Both glossaries come from the same metric registry, ported; this app's leaves out the
      garbage-time filter's 8 metrics (web_pages.md entry 9).
  - id: same-components
    match: 'component (HeadToHeadCard|MetricSections|RankHistogram|RankHistoryCard|RankInterval|RankRangeChart|RatingSummary|UnitRankRanges|ViewControls)'
    class: matched
    here: '{key}'
    note: >-
      Parts of its detail and range pages, ported under the same names
      (web/src/components/ratings/), in this app's palette (web_pages.md entries 5 and 13).
  - id: trend-chart
    match: 'component WeeklyTrendChart'
    class: matched
    here: component TrendChart
    note: The weekly line chart of one metric with its metric picker, renamed.
  - id: comparison-panel
    match: 'component ComparisonPanel'
    class: different
    here: '{key}'
    note: >-
      The comparison of up to four rows; here without each row's rank range (web_pages.md
      entry 19).
  - id: game-log-table
    match: 'component GameLogTable'
    class: different
    here: '{key}'
    note: >-
      The game log; here with the opponent's season ratings and no rank-range chip (web_pages.md
      entry 6).
  - id: entity-table
    match: 'component EntityTable'
    class: different
    here: component DataTable
    note: >-
      Its table component; this app draws every table with its shared DataTable, fed the
      registry's metadata in its own column format (web_pages.md entry 4), without the
      rank-range column (entry 19).
  - id: opponent-table
    match: 'component OpponentBreakdownTable'
    class: different
    here: component RatingsDetail
    note: >-
      Its opponents ledger averaged each stat over the games against each opponent; here the
      detail page's "Opponents faced" card lists one row per opponent with the games, results,
      average score, season ratings and tier (web_pages.md entry 11).
  - id: wp-components
    match: 'component (WpEntityLine|WpFilterControl)'
    class: missing
    phase: none planned (the garbage-time filter view is not ported, web_pages.md entry 9)
    note: The garbage-time filter controls (exploration only there).

columns:
  # --- Keys present in many kinds ---------------------------------------------------------
  - id: key-game-id
    kinds: [team_game_logs, qb_game_logs, team_wp_bins, qb_wp_bins]
    columns: [game_id]
    class: matched
    here: dataset:game_id
    note: The same nflverse game id.
  - id: key-week
    kinds: [team_game_logs, qb_game_logs, team_wp_bins, qb_wp_bins, ratings_by_week, qb_ratings_by_week, rating_ranges_by_week, qb_rating_ranges_by_week]
    columns: [week]
    class: matched
    here: team_game:week
  - id: key-team
    kinds: "*"
    columns: [team, opponent_team, excluded_team, other_team]
    class: different
    here_map:
      team: team_game:team_abbr
      opponent_team: team_game:opponent_abbr
      excluded_team: team_game:opponent_abbr
      other_team: team_game:opponent_abbr
    note: >-
      The same team codes except Washington, WAS there and WSH here, in the ported tables too
      (decisions/season_stats.md, kept on purpose).
  - id: key-qb
    kinds: "*"
    columns: [qb_id, other_qb_id]
    class: different
    here: qb_game:qb_id
    note: >-
      Both GSIS player ids, a scramble credited to its rusher. There a quarterback without one
      falls back to his snap-count id or his name, as in the ported tables; in the model's
      quarterback games a dropback with neither a passer nor a rusher id is no quarterback's.
  - id: key-qb-name
    kinds: "*"
    columns: [qb_name]
    class: different
    here: qb_game:passer_name
    note: >-
      There the players file's display name, as in the ported tables; in the model's quarterback
      games the play-by-play passer name.

  # --- Team game logs (one row per team-game) -----------------------------------------------
  - id: gl-games
    kinds: [team_game_logs, team_per_game_stats, combined]
    columns: [games]
    class: matched
    here: ratings:{column}
    note: The games a row counts, written only by the ported tables.
  - id: gl-home
    kinds: [team_game_logs]
    columns: [is_home]
    class: matched
    here: team_game:is_home
  - id: gl-score
    kinds: [team_game_logs]
    columns: [points_for, points_allowed]
    class: matched
    here: dataset:score
    note: The schedule's final score (here the game row's home_score and away_score).
  - id: gl-result
    kinds: [team_game_logs]
    columns: [point_margin, win_value, points_per_offensive_snap, points_allowed_per_defensive_snap]
    class: different
    here_map:
      point_margin: dataset:scoring_margin
      win_value: dataset:win_pct
      points_per_offensive_snap: dataset:points_per_play
      points_allowed_per_defensive_snap: dataset:opponent_points_per_play
    note: >-
      Here only as season-to-date features (the per-game margin is the model's target, computed
      from the game row's score).
  - id: gl-same-pbp
    kinds: [team_game_logs]
    columns: [attempts, completions, carries, st_epa, two_pt_conversions]
    class: matched
    here_map:
      attempts: box_score:pass_attempts
      completions: box_score:pass_completions
      carries: box_score:rush_attempts
      st_epa: team_game:st_epa_for
      two_pt_conversions: box_score:2pt_conversions
    note: The same play-by-play definition; equal in every team-game of 1999-2025 (PARITY.md).
  - id: gl-same-box-rates
    kinds: [team_game_logs]
    columns: [completion_pct, int_rate_per_attempt, passing_td_rate_per_attempt, offensive_tds, scrimmage_tds]
    class: matched
    here_map:
      completion_pct: box_score:pass_completions / pass_attempts
      int_rate_per_attempt: box_score:interceptions_thrown / pass_attempts
      passing_td_rate_per_attempt: box_score:pass_touchdowns / pass_attempts
      offensive_tds: box_score:pass_touchdowns + rush_touchdowns
      scrimmage_tds: box_score:pass_touchdowns + rush_touchdowns
    note: >-
      The same play-by-play counts over the same attempts; equal in every team-game of 1999-2025
      (PARITY.md, pairs pass_completions, pass_attempts, interceptions_from_rate,
      pass_touchdowns_from_rate and offensive_tds).
  - id: gl-sack-rate
    kinds: [team_game_logs]
    columns: [sack_rate_per_dropback]
    class: different
    here: [box_score:times_sacked, team_game:dropbacks]
    note: >-
      The same sacks (PARITY.md, pair sacks_from_rate) over different dropbacks: there a
      two-point pass is a dropback (PARITY.md, cause two_point_tries, kept).
  - id: gl-turnovers-on-downs
    kinds: [team_game_logs]
    columns: [turnovers_on_downs]
    class: matched
    here: ratings:{column}
    note: >-
      Fourth downs that failed, written only by the ported tables; the model's play-by-play
      aggregates no longer count failed downs.
  - id: gl-snaps
    kinds: [team_game_logs]
    columns: [offensive_snaps, defensive_snaps]
    class: matched
    here: team_game:{column}
    note: >-
      The same scrimmage snaps, a scramble filed as a run play included (since 0.54.0); equal in
      every team-game of 1999-2025 (PARITY.md, pairs offensive_snaps and defensive_snaps).
  - id: gl-dropbacks
    kinds: [team_game_logs]
    columns: [dropbacks, epa_per_dropback, pass_success_rate]
    class: different
    here_map:
      dropbacks: team_game:dropbacks
      epa_per_dropback: team_game:pass_epa_sum / dropbacks
      pass_success_rate: team_game:pass_success_count / dropbacks
    note: >-
      Scrambles filed as runs are dropbacks in both (since 0.54.0); there a two-point pass is one
      too, here not (PARITY.md, cause two_point_tries, kept).
  - id: gl-scrimmage-epa
    kinds: [team_game_logs]
    columns: [offensive_epa, epa_per_offensive_snap]
    class: different
    here_map:
      offensive_epa: team_game:pass_epa_sum + rush_epa_sum
      epa_per_offensive_snap: team_game:(pass_epa_sum + rush_epa_sum) / offensive_snaps
    note: >-
      There EPA over every scrimmage snap, the team rating's input (the ported ratings read it
      that way); here dropback plus designed-carry EPA, which leaves out two-point tries,
      kneel-downs, spikes without a rush attempt and runs a penalty wiped out, and takes in rush
      attempts nflverse files without the run flag (PARITY.md, pair scrimmage_epa_sum).
  - id: gl-designed-runs
    kinds: [team_game_logs]
    columns: [designed_carries, rush_success_rate]
    class: matched
    here_map:
      designed_carries: team_game:carries
      rush_success_rate: team_game:rush_success_count / carries
    note: >-
      The same designed runs, rush attempts that are neither scrambles, kneel-downs nor two-point
      tries (since 0.54.0); equal in every team-game of 1999-2025 (PARITY.md, pairs
      designed_carries and rush_success_count).
  - id: gl-carry-rates
    kinds: [team_game_logs]
    columns: [epa_per_carry, explosive_rush_rate, stuffed_run_rate]
    class: different
    here_map:
      epa_per_carry: team_game:rush_epa_sum / carries
      explosive_rush_rate: team_game:explosive_rush_count / carries
      stuffed_run_rate: team_game:stuffed_rush_count / carries
    note: >-
      There over every carry (scrambles and kneel-downs too; explosive at 10 yards, stuffs
      without kneel-downs); here over designed runs, explosive at 12 yards (kept on purpose in
      phase 1, DECISIONS.md).
  - id: gl-explosive-pass
    kinds: [team_game_logs]
    columns: [explosive_pass_rate]
    class: different
    here: team_game:explosive_pass_count / dropbacks
    note: There completions of 20 or more yards per dropback; here dropbacks gaining 20 or more.
  - id: gl-success
    kinds: [team_game_logs]
    columns: [success_rate]
    class: different
    here: team_game:(pass_success_count + rush_success_count) / (dropbacks + carries)
    note: There over every scrimmage snap; here over dropbacks and carries.
  - id: gl-early-down
    kinds: [team_game_logs]
    columns: [early_down_pass_rate]
    class: different
    here: team_game:early_down_passes / early_down_plays
    note: >-
      There a snap without a down (a two-point try) is an early down and two-point passes are
      dropbacks (PARITY.md, causes null_downs and two_point_tries).
  - id: gl-downs
    kinds: [team_game_logs]
    columns: [third_down_conversions, third_down_attempts, fourth_down_conversions, fourth_down_attempts, two_pt_attempts, third_down_pct, fourth_down_pct, two_pt_conversion_rate]
    class: matched
    here_map:
      third_down_conversions: team_game:third_down_conversions
      third_down_attempts: team_game:third_down_attempts
      fourth_down_conversions: team_game:fourth_down_conversions
      fourth_down_attempts: team_game:fourth_down_attempts
      two_pt_attempts: team_game:two_point_attempts
      third_down_pct: team_game:third_down_conversions / third_down_attempts
      fourth_down_pct: team_game:fourth_down_conversions / fourth_down_attempts
      two_pt_conversion_rate: team_game:two_point_successes / two_point_attempts
    note: >-
      The same flags read on every play, an attempt counted once (since 0.54.0); equal in every
      team-game of 1999-2025 (PARITY.md, the third-down, fourth-down and two-point pairs).
  - id: gl-first-downs
    kinds: [team_game_logs]
    columns: [first_downs]
    class: different
    here: box_score:first_downs
    note: >-
      There first downs by penalty count too; here passing plus rushing first downs (PARITY.md,
      cause penalty_first_downs, kept).
  - id: gl-fumbles
    kinds: [team_game_logs]
    columns: [fumbles, fumbles_lost]
    class: different
    here: box_score:{column}
    note: >-
      There fumbles on scrimmage snaps, a lost one charged to the team that fumbled; here fumbles
      on plays that are not special-teams plays, a lost one charged to the team with the ball
      (PARITY.md, cause fumbles_on_scrimmage_snaps, kept).
  - id: gl-penalties
    kinds: [team_game_logs]
    columns: [penalties, penalty_yards]
    class: matched
    here: box_score:{column}
    note: >-
      The same counts, Jacksonville's 2001-2002 home games repaired here too (since 0.54.0);
      equal in every team-game of 1999-2025 (PARITY.md, pairs penalties and penalty_yards).
  - id: gl-red-zone
    kinds: [team_game_logs]
    columns: [red_zone_trips, red_zone_td_pct]
    class: different
    here_map:
      red_zone_trips: team_game:red_zone_trips
