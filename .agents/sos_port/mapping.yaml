# Hand judgments for inventory.py: how each nfl-sos-ratings data source, output column and web
# item at the frozen commit 9081bce relates to this repository.
#
# inventory.py finds every item itself and applies these rules; it fails when an item matches no
# rule or more than one, when a rule matches nothing, and when a counterpart named here does not
# exist in this repository. Classes:
#   matched   - the same definition here; `here` names it.
#   different - a counterpart here with a different definition; `note` says how.
#   missing   - no counterpart here; `phase` says which step-6 phase ports it, or "none planned".
#
# Column rules match on any of: `kinds` (file kinds, or "*"), `columns` (exact names), `match`
# (regular expression on the column), `base` (its registry's base metric), `prefix` and `suffix`
# (its registry's affixes), `source` (the code-derived source for game logs, else its registry's
# label). A `rest: true` rule takes every column of its kinds that no other rule matches, and must
# say how many (`expect`), so a column the frozen commit does not have fails the run; any other
# rule may pin its count the same way. A column left `missing` (other than an opponents-faced
# profile column) fails the run when this repository has a column of the same name (or, for a
# season total or per-game value, of its base metric), or when another file kind gives that name
# a counterpart, unless `cross_kind_exceptions` (keyed `kind.column`) says why. A rule with
# `mirror_kind` takes each column's counterparts from the same column in that kind (`mirror_base`:
# from its base metric's column there).
# Counterparts are `<catalog>:<column>`, where the catalogs are this repository's
#   team_game  - aggregate_pbp_team_game_stats (play-by-play, per team-game)
#   box_score  - aggregate_pbp_team_box_score_stats (play-by-play, per team-game; it overrides
#                nflverse's team stats by default, team_stats_source "pbp")
#   team_stats - nflverse weekly team stats as cached (per team-game)
#   qb_game    - aggregate_qb_game_stats (play-by-play, per quarterback-game)
#   dataset    - a published game-dataset column, without its home_/away_ side prefix
#   strength   - the weekly strength snapshot file
# and arithmetic over names of one catalog (`team_game:pass_epa_sum / dropbacks`). `{column}`,
# `{base}` and `{core}` (the column without its prefix) are filled in per column.
#
# "Season-to-date" below means this repository's pre-game feature: the team's stats through the
# week before, blended toward the previous season (polars_utils.blend_with_prior_stats).

# Columns that may stay missing in one kind although another kind gives their name a
# counterpart, each with the reason. None today.
cross_kind_exceptions: {}

sources:
  - id: pbp
    match: 'nflreadpy\.load_pbp'
    class: different
    here: load:nflreadpy.load_pbp
    phase: phase 3 (team ratings) for the columns it needs
    note: >-
      Same regular-season play-by-play; there the full frame, here the columns of
      constants.PBP_COLUMNS, which leave out qb_scramble, play_id, play text and player ids.
  - id: schedules
    match: 'nflreadpy\.load_schedules'
    class: matched
    here: load:nflreadpy.load_schedules
    note: Same nflverse schedules; there regular season only.
  - id: team-stats
    match: 'nflreadpy\.load_team_stats'
    class: different
    here: load:nflreadpy.load_team_stats
    note: >-
      Same weekly team stats; there it drops a game with one team's row (Jacksonville's 2001-2002
      home games) and its values override play-by-play, here play-by-play overrides them.
  - id: player-stats
    match: 'nflreadpy\.load_player_stats'
    class: missing
    phase: phase 2 (nflverse sources)
    note: Weekly player stats, for the defensive stats and the quarterback's official totals.
  - id: snap-counts
    match: 'nflreadpy\.load_snap_counts'
    class: missing
    phase: phase 2 (nflverse sources)
    note: Snap counts (2013 on), for quarterback offensive snaps.
  - id: identity
    match: 'nflreadpy\.load_(players|rosters_weekly|rosters)'
    class: missing
    phase: phase 2 (nflverse sources)
    note: >-
      Players and rosters, for quarterback identity and the player-team repair of one-team games.
      This repository bridges quarterbacks through ../nfeloqb's meta_data.csv instead.
  - id: teams
    match: 'nflreadpy\.load_teams'
    class: missing
    phase: phase 6 (web pages)
    note: Team colors for its pages (team_palettes.py).
  - id: espn-qbr
    match: 'url https://github\.com/nflverse/nflverse-data/releases/download/espn_data/qbr_(season|week)_level\.parquet|network fetch'
    class: missing
    phase: phase 2 (nflverse sources), validation reference only
    note: ESPN QBR from the nflverse release assets, read over the network (data_loader._fetch_release_parquet).

web:
  - id: game-logs
    match: 'api GET /api/seasons/\{season\}/(teams/\{team\}|qbs/\{qb_id\})/game-logs'
    class: missing
    phase: phase 6 (web pages)
    note: Team and quarterback game logs.
  - id: rating-history
    match: 'api GET /api/seasons/\{season\}/(teams/\{team\}|qbs/\{qb_id\})/(rating|rank)-history'
    class: missing
    phase: phase 6 (web pages), on phase 3's weekly histories
    note: Weekly rating and rank histories.
  - id: rating-pairs
    match: 'api GET /api/seasons/\{season\}/(teams/\{team\}|qbs/\{qb_id\})/rating-pairs'
    class: missing
    phase: phase 6 (web pages), on phase 3's rank ranges
    note: Head-to-head chances between two teams or two quarterbacks.
  - id: rating-ranges
    match: 'api GET /api/seasons/\{season\}/(teams|qbs)/rating-ranges'
    class: missing
    phase: phase 6 (web pages), on phase 3's rank ranges
    note: Rank ranges.
  - id: wp-ratings
    match: 'api GET /api/seasons/\{season\}/(teams|qbs)/wp-ratings'
    class: missing
    phase: phase 6 (web pages)
    note: Ratings refit with the garbage-time filter (exploration only there).
  - id: refresh
    match: 'api (GET|POST) /api/refresh'
    class: different
    here: api POST /api/jobs
    note: Its refresh button rebuilds the season; this app starts data refreshes as jobs.
  - id: health
    match: 'api GET /api/health'
    class: matched
    here: api GET /api/health
  - id: metadata
    match: 'api GET /api/metadata'
    class: different
    here: api GET /api/registry
    note: Its metric registry against this app's column registry.
  - id: seasons
    match: 'api GET /api/seasons(/\{season\})?'
    class: missing
    phase: phase 6 (web pages)
    note: The season list and one season's whole dataset for its pages.
  - id: layout-route
    match: 'page /'
    class: different
    here: page /
    note: The layout route both apps nest their pages under (its app shell; this app's sign-in guard).
  - id: index-page
    match: 'page / \(index\)'
    class: different
    here: page / (index)
    note: Its index redirects to the teams page; this app's is the dashboard.
  - id: teams-page
    match: 'page /teams|component EntityIndexPage'
    class: different
    here: [page /power, component PowerRankings]
    phase: phase 5 (power rankings) and phase 6 (web pages)
    note: Its team and quarterback tables against this app's power rankings.
  - id: entity-pages
    match: 'page /(teams|qbs)/:entityId|page /qbs|component (EntityDetailPage|SeasonDataRoute)'
    class: missing
    phase: phase 6 (web pages)
    note: Team and quarterback detail pages and the quarterback table.
  - id: glossary
    match: 'page /glossary|component GlossaryPage'
    class: different
    here: [page /glossary, component Glossary]
    note: Both glossaries; its entries come from its metric registry.
  - id: entity-components
    match: 'component (ComparisonPanel|EntityTable|GameLogTable|HeadToHeadCard|MetricSections|OpponentBreakdownTable|RankHistogram|RankHistoryCard|RankInterval|RankRangeChart|RatingSummary|UnitRankRanges|ViewControls|WeeklyTrendChart)'
    class: missing
    phase: phase 6 (web pages)
    note: The parts of its detail pages (game logs, opponents, head-to-head, rank ranges, histories).
  - id: wp-components
    match: 'component (WpEntityLine|WpFilterControl)'
    class: missing
    phase: phase 6 (web pages)
    note: The garbage-time filter controls (exploration only there).

columns:
  # --- Keys present in many kinds ---------------------------------------------------------
  - id: key-game-id
    kinds: [team_game_logs, qb_game_logs, team_wp_bins, qb_wp_bins]
    columns: [game_id]
    class: matched
    here: dataset:game_id
    note: The same nflverse game id.
  - id: key-week
    kinds: [team_game_logs, qb_game_logs, team_wp_bins, qb_wp_bins, ratings_by_week, qb_ratings_by_week, rating_ranges_by_week, qb_rating_ranges_by_week]
    columns: [week]
    class: matched
    here: team_game:week
  - id: key-team
    kinds: "*"
    columns: [team, opponent_team, excluded_team, other_team]
    class: different
    here_map:
      team: team_game:team_abbr
      opponent_team: team_game:opponent_abbr
      excluded_team: team_game:opponent_abbr
      other_team: team_game:opponent_abbr
    note: The same team codes except Washington, WAS there and WSH here.
  - id: key-qb
    kinds: "*"
    columns: [qb_id, other_qb_id]
    class: different
    here: qb_game:qb_id
    note: >-
      Both GSIS player ids; there a quarterback without one falls back to his snap-count id or his
      name, here a dropback without a passer id goes to the team-game's main passer.
  - id: key-qb-name
    kinds: "*"
    columns: [qb_name]
    class: different
    here: qb_game:passer_name
    note: There the players file's display name; here the play-by-play passer name.

  # --- Team game logs (one row per team-game) -----------------------------------------------
  - id: gl-games
    kinds: [team_game_logs, team_per_game_stats, combined]
    columns: [games]
    class: missing
    phase: none planned (a row count)
  - id: gl-home
    kinds: [team_game_logs]
    columns: [is_home]
    class: matched
    here: team_game:is_home
  - id: gl-score
    kinds: [team_game_logs]
    columns: [points_for, points_allowed]
    class: matched
    here: dataset:score
    note: The schedule's final score (here the game row's home_score and away_score).
  - id: gl-result
    kinds: [team_game_logs]
    columns: [point_margin, win_value, points_per_offensive_snap, points_allowed_per_defensive_snap]
    class: different
    here_map:
      point_margin: dataset:scoring_margin
      win_value: dataset:win_pct
      points_per_offensive_snap: dataset:points_per_play
      points_allowed_per_defensive_snap: dataset:opponent_points_per_play
    note: >-
      Here only as season-to-date features (the per-game margin is the model's target, computed
      from the game row's score).
  - id: gl-same-pbp
    kinds: [team_game_logs]
    columns: [attempts, completions, carries, st_epa, two_pt_conversions]
    class: matched
    here_map:
      attempts: box_score:pass_attempts
      completions: box_score:pass_completions
      carries: box_score:rush_attempts
      st_epa: team_game:st_epa_for
      two_pt_conversions: box_score:2pt_conversions
    note: The same play-by-play definition; equal in every team-game of 1999-2025 (PARITY.md).
  - id: gl-same-box-rates
    kinds: [team_game_logs]
    columns: [completion_pct, int_rate_per_attempt, passing_td_rate_per_attempt, offensive_tds, scrimmage_tds]
    class: matched
    here_map:
      completion_pct: box_score:pass_completions / pass_attempts
      int_rate_per_attempt: box_score:interceptions_thrown / pass_attempts
      passing_td_rate_per_attempt: box_score:pass_touchdowns / pass_attempts
      offensive_tds: box_score:pass_touchdowns + rush_touchdowns
      scrimmage_tds: box_score:pass_touchdowns + rush_touchdowns
    note: >-
      The same play-by-play counts over the same attempts; equal in every team-game of 1999-2025
      (PARITY.md, pairs pass_completions, pass_attempts, interceptions_from_rate,
      pass_touchdowns_from_rate and offensive_tds).
  - id: gl-sack-rate
    kinds: [team_game_logs]
    columns: [sack_rate_per_dropback]
    class: different
    here: [box_score:times_sacked, team_game:dropbacks]
    note: >-
      The same sacks (PARITY.md, pair sacks_from_rate) over different dropbacks: there two-point
      passes and pre-2006 scrambles are dropbacks.
  - id: gl-turnovers-on-downs
    kinds: [team_game_logs]
    columns: [turnovers_on_downs]
    class: different
    here: team_game:fourth_down_fails
    note: >-
      Fourth downs that failed; here only on run, pass, kneel and spike plays (PARITY.md, pair
      turnovers_on_downs).
  - id: gl-snaps
    kinds: [team_game_logs]
    columns: [offensive_snaps, defensive_snaps]
    class: different
    here: team_game:{column}
    phase: phase 3 (team ratings)
    note: There a pre-2006 scramble is a snap (its dropback rule); here it is in no count.
  - id: gl-dropbacks
    kinds: [team_game_logs]
    columns: [dropbacks, epa_per_dropback, pass_success_rate]
    class: different
    here_map:
      dropbacks: team_game:dropbacks
      epa_per_dropback: team_game:pass_epa_sum / dropbacks
      pass_success_rate: team_game:pass_success_count / dropbacks
    phase: phase 3 (team ratings)
    note: There two-point passes and pre-2006 scrambles are dropbacks; here neither is.
  - id: gl-scrimmage-epa
    kinds: [team_game_logs]
    columns: [offensive_epa, epa_per_offensive_snap]
    class: different
    here_map:
      offensive_epa: team_game:pass_epa_sum + rush_epa_sum
      epa_per_offensive_snap: team_game:(pass_epa_sum + rush_epa_sum) / offensive_snaps
    phase: phase 3 (team ratings)
    note: >-
      There EPA over every scrimmage snap, the team rating's input; here dropback plus carry EPA,
      without kneel-downs, spikes, two-point tries and pre-2006 scrambles.
  - id: gl-designed-runs
    kinds: [team_game_logs]
    columns: [designed_carries, rush_success_rate]
    class: different
    here_map:
      designed_carries: team_game:carries
      rush_success_rate: team_game:rush_success_count / carries
    phase: phase 3 (team ratings)
    note: >-
      There rush attempts that are neither scrambles nor kneel-downs; here the rush flag, which
      also counts runs a penalty wiped out.
  - id: gl-carry-rates
    kinds: [team_game_logs]
    columns: [epa_per_carry, explosive_rush_rate, stuffed_run_rate]
    class: different
    here_map:
      epa_per_carry: team_game:rush_epa_sum / carries
      explosive_rush_rate: team_game:explosive_rush_count / carries
      stuffed_run_rate: team_game:stuffed_rush_count / carries
    note: >-
      There over every carry (scrambles and kneel-downs too; explosive at 10 yards, stuffs
      without kneel-downs); here over the rush flag's carries, explosive at 12 yards.
  - id: gl-explosive-pass
    kinds: [team_game_logs]
    columns: [explosive_pass_rate]
    class: different
    here: team_game:explosive_pass_count / dropbacks
    note: There completions of 20 or more yards per dropback; here dropbacks gaining 20 or more.
  - id: gl-success
    kinds: [team_game_logs]
    columns: [success_rate]
    class: different
    here: team_game:(pass_success_count + rush_success_count) / (dropbacks + carries)
    note: There over every scrimmage snap; here over dropbacks and carries.
  - id: gl-early-down
    kinds: [team_game_logs]
    columns: [early_down_pass_rate]
    class: different
    here: team_game:early_down_passes / early_down_plays
    note: There a snap without a down (a two-point try) is an early down and two-point passes are dropbacks.
  - id: gl-downs
    kinds: [team_game_logs]
    columns: [third_down_conversions, third_down_attempts, fourth_down_conversions, fourth_down_attempts, two_pt_attempts, third_down_pct, fourth_down_pct, two_pt_conversion_rate]
    class: different
    here_map:
      third_down_conversions: team_game:third_down_conversions
      third_down_attempts: team_game:third_down_attempts
      fourth_down_conversions: team_game:fourth_down_conversions
      fourth_down_attempts: team_game:fourth_down_attempts
      two_pt_attempts: team_game:two_point_attempts
      third_down_pct: team_game:third_down_conversions / third_down_attempts
      fourth_down_pct: team_game:fourth_down_conversions / fourth_down_attempts
      two_pt_conversion_rate: team_game:two_point_successes / two_point_attempts
    note: >-
      There the flags on every play, an attempt counted once; here only run, pass, kneel and
      spike plays, and an attempt is conversions plus failures.
  - id: gl-first-downs
    kinds: [team_game_logs]
    columns: [first_downs]
    class: different
    here: box_score:first_downs
    note: There first downs by penalty count too; here passing plus rushing first downs.
  - id: gl-fumbles
    kinds: [team_game_logs]
    columns: [fumbles, fumbles_lost]
    class: different
    here: box_score:{column}
    note: >-
      There fumbles on scrimmage snaps, a lost one charged to the team that fumbled; here fumbles
      on plays that are not special-teams plays, a lost one charged to the team with the ball.
  - id: gl-penalties
    kinds: [team_game_logs]
    columns: [penalties, penalty_yards]
    class: different
    here: box_score:{column}
    note: The same count, but there Jacksonville's 2001-2002 home games get their player teams repaired.
  - id: gl-red-zone
    kinds: [team_game_logs]
    columns: [red_zone_trips, red_zone_td_pct]
    class: different
    here_map:
      red_zone_trips: team_game:red_zone_trips
      red_zone_td_pct: team_game:red_zone_td_drives / red_zone_trips
    note: There drives nflverse flags as reaching the 20; here drives with a snap inside the 20.
  - id: gl-st-plays
    kinds: [team_game_logs]
    columns: [st_plays]
    class: different
    here: team_game:st_plays
    phase: phase 3 (team ratings)
    note: There the team's own special-teams plays (the special-teams rating's weight); here both teams'.
  - id: gl-official-box
    kinds: [team_game_logs]
    columns: [passing_yards, rushing_yards, total_yards, passing_tds, rushing_tds, passing_epa, rushing_epa, passing_cpoe, sacks_suffered, passing_interceptions]
    class: different
    here_map:
      passing_yards: box_score:pass_yards
      rushing_yards: box_score:rush_yards
      total_yards: box_score:total_yards
      passing_tds: box_score:pass_touchdowns
      rushing_tds: box_score:rush_touchdowns
      passing_epa: box_score:passing_epa
      rushing_epa: box_score:rushing_epa
      passing_cpoe: box_score:passing_cpoe
      sacks_suffered: box_score:times_sacked
      passing_interceptions: box_score:interceptions_thrown
    note: >-
      There nflverse's official weekly team stat; here play-by-play first (team_stats_source "pbp"),
      nflverse where play-by-play has no value. Total yards there are passing plus rushing yards.
  - id: gl-official-team-stats
    kinds: [team_game_logs]
    columns: [passing_first_downs, rushing_first_downs, sack_fumbles_lost, rushing_fumbles_lost]
    class: different
    here_map:
      passing_first_downs: team_stats:first_downs
      rushing_first_downs: team_stats:first_downs
      sack_fumbles_lost: team_stats:fumbles_lost
      rushing_fumbles_lost: team_stats:fumbles_lost
    note: The same official stats, kept here only as totals (first downs; lost fumbles of every kind).
  - id: gl-official-allowed
    kinds: [team_game_logs]
    columns: [passing_yards_allowed, rushing_yards_allowed, total_yards_allowed, passing_tds_allowed, rushing_tds_allowed, passing_epa_allowed, rushing_epa_allowed, passing_cpoe_allowed, passing_first_downs_allowed, rushing_first_downs_allowed]
    class: different
    here_map:
      passing_yards_allowed: box_score:pass_yards
      rushing_yards_allowed: box_score:rush_yards
      total_yards_allowed: box_score:total_yards
      passing_tds_allowed: box_score:pass_touchdowns
      rushing_tds_allowed: box_score:rush_touchdowns
      passing_epa_allowed: box_score:passing_epa
      rushing_epa_allowed: box_score:rushing_epa
      passing_cpoe_allowed: box_score:passing_cpoe
      passing_first_downs_allowed: team_stats:first_downs
      rushing_first_downs_allowed: team_stats:first_downs
    note: The opponent's row of the same table, with the offense judgments above.
  - id: gl-faced
    kinds: [team_game_logs]
    columns: [attempts_faced, completions_allowed]
    class: matched
    here_map:
      attempts_faced: box_score:pass_attempts
      completions_allowed: box_score:pass_completions
    note: The opponent's row; the same play-by-play definition.
  - id: gl-carries-faced
    kinds: [team_game_logs]
    columns: [carries_faced]
    class: different
    here: team_game:carries_allowed
    note: There the opponent's rush attempts; here its rush-flag carries.
  - id: gl-defense-rates
    kinds: [team_game_logs]
    columns: [epa_per_dropback_allowed, epa_per_defensive_snap_allowed, rush_success_rate_allowed, success_rate_allowed, explosive_pass_rate_allowed, explosive_rush_rate_allowed, stuff_rate, third_down_pct_allowed, fourth_down_pct_allowed, red_zone_td_pct_allowed, two_pt_conversion_rate_allowed]
    class: different
    here_map:
      epa_per_dropback_allowed: team_game:pass_epa_allowed_sum / dropbacks_allowed
      epa_per_defensive_snap_allowed: team_game:(pass_epa_allowed_sum + rush_epa_allowed_sum) / defensive_snaps
      rush_success_rate_allowed: team_game:rush_success_allowed_count / carries_allowed
      success_rate_allowed: team_game:(pass_success_allowed_count + rush_success_allowed_count) / (dropbacks_allowed + carries_allowed)
      explosive_pass_rate_allowed: team_game:explosive_pass_allowed_count / dropbacks_allowed
      explosive_rush_rate_allowed: team_game:explosive_rush_allowed_count / carries_allowed
      stuff_rate: team_game:stuffed_rush_allowed_count / carries_allowed
      third_down_pct_allowed: team_game:third_down_conversions_allowed / third_down_attempts_allowed
      fourth_down_pct_allowed: team_game:fourth_down_conversions_allowed / fourth_down_attempts_allowed
      red_zone_td_pct_allowed: team_game:red_zone_td_drives_allowed / red_zone_trips_allowed
      two_pt_conversion_rate_allowed: team_game:two_point_successes_allowed / two_point_attempts_allowed
    note: The opponent's offense, with the offense judgments above.
  - id: gl-first-downs-allowed
    kinds: [team_game_logs]
    columns: [first_downs_allowed]
    class: different
    here: box_score:first_downs
    note: The opponent's row; there first downs by penalty count too.
  - id: gl-nflverse-here
    kinds: [team_game_logs]
    columns: [sack_yards_lost, passing_air_yards, passing_yards_after_catch, targets, receptions, receiving_yards, receiving_tds, receiving_air_yards, receiving_yards_after_catch, receiving_first_downs, turnover_margin, def_tds, fumble_recovery_tds, def_interception_yards, def_sack_yards, fumble_recovery_opp, defensive_2pt_conversions]
    class: different
    here_map:
      sack_yards_lost: team_stats:yards_lost_from_sacks
      passing_air_yards: team_stats:passing_air_yards
      passing_yards_after_catch: team_stats:passing_yac
      targets: team_stats:targets
      receptions: team_stats:receptions
      receiving_yards: team_stats:receiving_yards
      receiving_tds: team_stats:receiving_touchdowns
      receiving_air_yards: team_stats:receiving_air_yards
      receiving_yards_after_catch: team_stats:receiving_yac
      receiving_first_downs: team_stats:receiving_first_downs
      turnover_margin: team_stats:turnover_margin
      def_tds: team_stats:def_tds
      fumble_recovery_tds: team_stats:fumble_recovery_tds
      def_interception_yards: team_stats:def_interception_yards
      def_sack_yards: team_stats:def_sack_yards
      fumble_recovery_opp: team_stats:fumble_recoveries
      defensive_2pt_conversions: team_stats:def_2pt_made
    note: >-
      There from play-by-play (the receiving columns copy the passing ones before the official
