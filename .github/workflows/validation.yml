name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Create virtual environment
        run: uv venv .venv

      - name: Sync dependencies
        run: |
          source .venv/bin/activate
          uv sync --active

      - name: Verify synced environment
        run: |
          source .venv/bin/activate
          uv sync --check --active

      - name: Ruff format check
        run: .venv/bin/ruff format --check .

      - name: Ruff lint
        run: .venv/bin/ruff check .

      - name: Ty
        run: .venv/bin/ty check .

      - name: Pyright
        run: .venv/bin/pyright .

      - name: Pytest
        run: .venv/bin/python -m pytest

      - name: Set up Node.js for markdownlint
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install markdownlint
        run: npm install --global markdownlint-cli

      - name: Markdownlint
        run: markdownlint .

      - name: Editable install smoke check
        run: uv pip install --python .venv/bin/python -e . --no-deps

      - name: CLI help smoke checks
        run: |
          .venv/bin/nfl-predictor --help >/dev/null
          for command in $(.venv/bin/python -c 'from nfl_predictor.cli.main import COMMANDS; print(" ".join(c.name for c in COMMANDS))'); do
            .venv/bin/nfl-predictor "$command" --help >/dev/null
          done

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build
