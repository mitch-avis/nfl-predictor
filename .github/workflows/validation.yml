name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Create virtual environment
        run: uv venv .venv

      - name: Sync dependencies
        run: |
          source .venv/bin/activate
          uv sync --active --locked

      - name: Set up Node.js for markdownlint
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install markdownlint
        run: npm install --global markdownlint-cli

      - name: Editable install smoke check
        run: uv pip install --python .venv/bin/python -e . --no-deps

      # The one gate: lock and sync checks, ruff format and lint, ty, pyright, pytest,
      # markdownlint and every front-door command's --help, exactly as it runs locally.
      - name: Gate
        run: |
          source .venv/bin/activate
          scripts/gate.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # pnpm goes first so setup-node can find it for the store cache.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm run build
