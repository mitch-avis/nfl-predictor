# Local git hooks. scripts/gate.sh is the one gate: these hooks call it rather than reimplement it,
# and every Python tool runs as .venv/bin/<tool>, so a hook run never disagrees with the gate or CI
# about which version ran.
#
# Setup (once per clone, after `uv sync`):
#   .venv/bin/pre-commit install --install-hooks
#
# That installs every hook type in `default_install_hook_types`: formatting and lint feedback on
# `git commit`, the Conventional Commits check on the message, and the full gate on `git push`.

minimum_pre_commit_version: "4.7.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
exclude: ^(\.venv/|build/|dist/|web/node_modules/|web/dist/|nfl-sos-ratings/)

repos:
  # Generic file hygiene; these don't touch the project's toolchain, so pre-commit's own isolated
  # hook environments are fine here.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(uv\.lock|web/pnpm-lock\.yaml)$
      - id: end-of-file-fixer
        exclude: ^(uv\.lock|web/pnpm-lock\.yaml)$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # tsconfig*.json is JSONC (comments, trailing commas), not strict JSON.
        exclude: ^web/tsconfig.*\.json$
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, docs, test, refactor, perf, build, ci, chore]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check --fix
        entry: .venv/bin/ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      # Type checks, tests and markdownlint need the whole project, so they run once per push.
      - id: gate
        name: scripts/gate.sh
        entry: scripts/gate.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
