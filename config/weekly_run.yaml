## weekly_run.yaml - configuration for weekly_run script

## General run settings:
# unique identifier for this weekly run (default: generated)
run_id: weekly_2025_week_22
# whether to skip data collection stage (default: false)
skip_data_refresh: false
# resume from previous run or start fresh (default: true)
resume: true
# save model checkpoints for each fold during walk-forward evaluation (default: false)
wf_checkpoint_per_fold: true

## Walk-forward evaluation parameters:
# number of most recent seasons to include in walk-forward evaluation (default: 3)
wf_eval_last_n_seasons: 10
# starting week for walk-forward evaluation (default: 3)
wf_start_week: 3
# number of weeks to use for model calibration in walk-forward evaluation (default: 4)
wf_calibration_weeks: 8
# whether to include postseason games in walk-forward evaluation (default: false)
wf_include_postseason: true
# market mode for walk-forward evaluation (options: features, anchor, hybrid, all, default: hybrid)
wf_market_mode: hybrid
# market probability source for walk-forward evaluation (options: raw, novig, both, default: raw)
wf_market_prob_source: novig
# blending method for market probabilities in walk-forward evaluation (options: prob, logit, both, default: prob)
wf_market_prob_blend_method: logit
# use uncertainty-aware win probabilities for walk-forward model win probabilities (options: off, on, both, default: off)
wf_win_prob_uncertainty: off
# include quantile-based features in walk-forward model training (default: false)
wf_include_quantiles: false

## Walk-forward model hyperparameters:
# number of estimators for walk-forward XGBoost model (default: 120)
wf_n_estimators: 200
# maximum depth for walk-forward XGBoost model (default: 4)
wf_max_depth: 4
# learning rate for walk-forward XGBoost model (default: 0.07)
wf_learning_rate: 0.03
# early stopping rounds for walk-forward XGBoost model (default: 50)
wf_early_stopping_rounds: 50
# number of parallel jobs for walk-forward XGBoost model training (default: 1)
wf_n_jobs: 12

## Final model training parameters:
# whether to include postseason games in final model training (default: false)
include_postseason: true
# weight multiplier for postseason games in final model training (default: 1.0)
postseason_weight: 1.3
# exponential recency weighting half-life in seasons for final model training (default: none)
train_recency_half_life_seasons: 4
# early stopping rounds for final model training (default: 50)
train_early_stopping_rounds: 80
# whether to include transformed market-based features in final model training (default: auto)
market_transform: true
# number of weeks to use for model calibration in final model training (default: wf_calibration_weeks)
train_calibration_weeks: 8

## Optuna hyperparameter tuning settings:
# whether to perform hyperparameter tuning before final model training (default: false)
tune: true
# Optuna tuning timeout in seconds (default: 600)
tune_timeout: 3600
# number of cross-validation splits for Optuna tuning (default: 3)
tune_cv_splits: 5
# Optuna objective metric for hyperparameter tuning (options: margin_mae, total_mae, combined_mae,
# winner_accuracy, brier, expected_points default: brier)
tune_objective: brier

## XGBoost runtime configuration:
# XGBoost tree method (options: auto, exact, approx, hist, gpu_hist, default: auto)
xgb_tree_method: hist
# XGBoost device (options: cpu, cuda, default: cpu)
xgb_device: cuda
# number of parallel jobs for XGBoost training (default: 1)
xgb_n_jobs: 12

## Prediction output settings:
# path to CSV file with games to predict
predict_path: data/predict/week_22_games_to_predict.csv
# optional score rounding method for predictions (options: none, int, half, nfl, default: none)
score_rounding: nfl
# path to Excel betting template for predictions
betting_template_path: data/predict/week_22_betting_template.xlsx
# minimum season for including historical ratings in prediction output
ratings_min_season: 2025
# minimum season for power rankings inclusion
power_rankings_season: 2025
# most recent week to include in power rankings
power_rankings_through_week: 21
# whether to include postseason games in power rankings (default: false)
power_rankings_include_postseason: true
