## weekly_run.yaml - the weekly run's configuration (`nfl-predictor weekly`)
#
# The weekly run reads this file by default; `--config <path>` reads another one, and command-line
# options override either. Every value below is the code default except two that change nothing a
# weekly run produces: data_collection_args (its --incremental refresh writes what a full rebuild
# writes) and postseason_weight (1.3 against 1.0, inert while include_postseason is false). So this
# file documents what a weekly run does rather than changing it. A key that is commented out uses
# its code default, which is "automatic" or "none" for those keys. Changing a value changes what the weekly run produces;
# decide such changes with a walk-forward measurement first.

## General run settings:
# run_id omitted so weekly_run generates a fresh artifact-friendly id by default.
# whether to skip data collection stage (default: false)
skip_data_refresh: false
# extra arguments for the data collection refresh, as one shell-quoted string (default: none).
# The weekly run sets --incremental, which reuses each finished season's cached build when nothing
# it reads has changed; the output is the same as a full rebuild's. A --data-collection-args value
# on the command line replaces this string rather than adding to it, so keep --incremental in it to
# keep the reuse (for example "--incremental --min-season 2010"); a file read with --config sets
# its own value or none, and none is a full rebuild. Every option the string leaves out takes the
# data command's default, so the refresh builds the line known at pick time (--line-source
# pick_time); add "--line-source stored" to build the stored nflverse lines instead.
data_collection_args: "--incremental"
# resume from previous run or start fresh (default: true)
resume: true
# write a progress line after every walk-forward week of stage 1 (default: false)
wf_checkpoint_per_fold: false

## Walk-forward evaluation parameters (stage 1, one walk-forward of the production configuration:
## the deterministic floor, trained with wf_market_mode; each week's fold trains on every earlier
## completed game, as the final fit does):
# walk-forward runs whose out-of-fold margin errors set the probability floor's sigma,
# Phi(margin / sigma), with sigma the root-mean-square error of every out-of-fold prediction before
# the predicted week. Stage 1 pools them with its own earlier weeks; the final fit pools them with
# stage 1's weeks before the predicted week that the runs have no rows for (the seasons after
# them and the predicted season's earlier weeks) and records the sigma in the saved model. Run
# directories or fold checkpoint directories, relative to the repository root; their checkpoints
# are only read, and several runs are averaged per game. A listed run that is missing stops the
# run. An empty list ([]) uses only stage 1's folds, which fall back to the constant 14.21 until
# they span three earlier seasons, any weeks of them (default: both seeds of the reviewed
# reference walk-forward of production's settings, market anchored with the strength snapshot and
# both own-Elo presets left out; constants.FLOOR_SIGMA_REFERENCE_RUNS)
floor_sigma_reference_runs:
  - models/step6/ratings_anchored_seed42
  - models/step6/ratings_anchored_seed7
# number of most recent seasons to include; the current season counts even before it has a
# completed week, so 3 scores two seasons (default: 3)
wf_eval_last_n_seasons: 3
# starting week for walk-forward evaluation; week 1 scores every week, so the errors of weeks 1
# and 2 also reach the final fit's floor-sigma pool (default: 1)
wf_start_week: 1
# exponential recency weighting half-life in seasons (default: none, i.e. unweighted; keep it
# equal to train_recency_half_life_seasons)
# wf_recency_half_life_seasons: 16
# whether to include postseason games in walk-forward evaluation (default: false)
wf_include_postseason: false
# market mode of the walk-forward and the final fit: market lines as features, the model
# anchored to them, both, or none, a run with no game lines: no market feature, anchor or
# transform (options: features, anchor, hybrid, none, default: hybrid)
wf_market_mode: hybrid
# feature groups stage 1 and the final fit both leave out, every column of each: the columns
# `nfl-predictor backtest --disable-feature-groups` drops for the same groups (the groups and their
# column markers are constants.FEATURE_GROUP_COLUMN_MARKERS). Production leaves out the strength
# snapshot (strength), both presets of this repository's own Elo (own_elo, own_elo_wt) and the
# qb_elos.csv quarterback adjustment (qb_adj), so it trains on the ported team ratings (ratings)
# and the qb_elos.csv Elo (elo); leaving out strength on data without the ported ratings stops
# the run. An empty list ([]) leaves no group out, and the key with no value is refused.
# The saved model records them. An unknown group stops the run
# before the data refresh, and --disable-feature-groups on the command line takes them
# comma-separated, an empty value for none (default: [strength, own_elo, own_elo_wt, qb_adj])
disable_feature_groups:
  - strength
  - own_elo
  - own_elo_wt
  - qb_adj
# include quantile models in walk-forward training (default: false)
wf_include_quantiles: false

## XGBoost model hyperparameters of stage 1 and the final fit (tuned values replace them in the
## final fit when tune is on):
# number of estimators, the tree budget (default: 200)
wf_n_estimators: 200
# maximum tree depth (default: 5)
wf_max_depth: 5
# learning rate (default: 0.0165)
wf_learning_rate: 0.0165

## Final model training parameters (the final fit trains on every completed game except the
## holdout seasons, the newest week included, with no eval frame):
# newest whole seasons held out of the final fit and scored as an evaluation holdout (default: 0)
holdout_seasons: 0
# whether to include postseason games in final model training (default: false)
include_postseason: false
# weight multiplier for postseason games in final model training; applies only with
# include_postseason: true, and kept at 1.3 for postseason training (default: 1.0)
postseason_weight: 1.3
# exponential recency weighting half-life in seasons for final model training (default: none,
# i.e. unweighted; keep it equal to wf_recency_half_life_seasons)
# train_recency_half_life_seasons: 16
# early stopping rounds for Optuna tuning trials only (default: 50)
tune_early_stopping_rounds: 50
# transformed market features in final model training (default: automatic, on whenever market
# lines exist)
# market_transform: true

## Optuna hyperparameter tuning settings:
# whether to perform hyperparameter tuning before final model training (default: false)
tune: false
# Optuna tuning timeout in seconds (default: 600)
tune_timeout: 600
# number of cross-validation splits for Optuna tuning (default: 3)
tune_cv_splits: 3
# Optuna objective metric for hyperparameter tuning (options: margin_mae, total_mae, combined_mae,
# winner_accuracy, brier, expected_points, default: brier)
tune_objective: brier

## XGBoost runtime configuration:
# XGBoost tree method (default: automatic)
# xgb_tree_method: hist
# XGBoost device for stage 1 and the final fit (options: auto, cpu, cuda, default: auto). auto
# picks the GPU when this XGBoost build has CUDA and a usable GPU is present, else the CPU; the
# resolved device is what the run records.
xgb_device: auto
# XGBoost CPU threads for stage 1 and the final fit; results do not depend on it (default: every
# CPU core)
# xgb_n_jobs: 12

## Prediction output settings:
# predict_path omitted so weekly_run picks the newest data/predict/week_XX_games_to_predict.csv.
# score rounding for displayed predictions; never changes probabilities or picks (options: none,
# int, half, nfl, default: none)
score_rounding: none
# ratings_min_season omitted so ratings can use the full available history by default.
# power_rankings_season and power_rankings_through_week are inferred from the prediction input.
# whether to include postseason games in power rankings (default: false)
power_rankings_include_postseason: false
# what the power rankings rank on (options: blend, composite, bradley_terry, ported, model,
# default: blend): blend averages the ported team rating and the model rating, a fit to the
# walk-forward's predicted margins. With no power_rankings_model_predictions, the model rating
# reads this run's stage-1 fold checkpoints for the ranked season and the
# floor_sigma_reference_runs, averaged as one source, for the seasons before it. The user chose
# the blend after the rankings measurement (.agents/sos_port/decisions/power_rankings.md,
# decision 12; models/step6/rankings/REVIEW.md); composite restores the earlier ranking. Left
# unset, the default applies, and legacy_franchise_fit: true then ranks on bradley_terry; a method
# set here or on the command line conflicts with legacy_franchise_fit unless it is bradley_terry.
# power_rankings_method: blend
# the blend's weight on the ported rating, from 0 to 1 (default: 0.5): the weight
# the measurement's pre-registered rule chooses for 2026 from the earlier seasons' scored weeks
# (decisions 7 and 12 of the same file). It applies to every season ranked: the rule gives 0.7
# for 2008-2009 and 0.6 for 2012-2014, which matters only when one of those is ranked again.
power_rankings_blend_weight: 0.5
