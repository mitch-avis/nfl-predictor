## weekly_run.yaml - the weekly run's configuration (`nfl-predictor weekly`)
#
# The weekly run reads this file by default; `--config <path>` reads another one, and command-line
# options override either. Every value below is the code default, so this file documents what a
# weekly run does rather than changing it. A key that is commented out uses its code default,
# which is "automatic" or "none" for those keys. Changing a value changes what the weekly run
# produces; decide such changes with a walk-forward measurement first.

## General run settings:
# run_id omitted so weekly_run generates a fresh artifact-friendly id by default.
# whether to skip data collection stage (default: false)
skip_data_refresh: false
# extra arguments for the data collection refresh, as one shell-quoted string (default: none)
# data_collection_args: "--min-season 2010 --stat-prior-blend-games 4"
# resume from previous run or start fresh (default: true)
resume: true
# write a progress line and checkpoint after every walk-forward fold of stage 1 (default: false)
wf_checkpoint_per_fold: false

## Walk-forward evaluation parameters (stage 1):
# number of most recent seasons to include; the current season counts even before it has a
# completed week, so 3 scores two seasons (default: 3)
wf_eval_last_n_seasons: 3
# starting week for walk-forward evaluation (default: 3)
wf_start_week: 3
# number of newest weeks held out of the tree fit for calibration (default: 4)
wf_calibration_weeks: 4
# exponential recency weighting half-life in seasons (default: none, i.e. unweighted; keep it
# equal to train_recency_half_life_seasons)
# wf_recency_half_life_seasons: 16
# whether to include postseason games in walk-forward evaluation (default: false)
wf_include_postseason: false
# market mode (options: features, anchor, hybrid, all, default: hybrid)
wf_market_mode: hybrid
# market probability source (options: raw, novig, both, default: raw)
wf_market_prob_source: raw
# blending method for market probabilities (options: prob, logit, both, default: prob)
wf_market_prob_blend_method: prob
# uncertainty-aware win probabilities (options: off, on, both, default: off); quoted, because
# YAML reads a bare off as the boolean false
wf_win_prob_uncertainty: "off"
# include quantile models in walk-forward training (default: false)
wf_include_quantiles: false

## Walk-forward model hyperparameters:
# number of estimators for walk-forward XGBoost model (default: 200)
wf_n_estimators: 200
# maximum depth for walk-forward XGBoost model (default: 5)
wf_max_depth: 5
# learning rate for walk-forward XGBoost model (default: 0.0165)
wf_learning_rate: 0.0165
# XGBoost threads for stage 1 when xgb_n_jobs is not set (default: 1)
wf_n_jobs: 1

## Final model training parameters:
# whether to include postseason games in final model training (default: false)
include_postseason: false
# weight multiplier for postseason games in final model training; applies only with
# include_postseason: true, and kept at 1.3 for postseason training (default: 1.0)
postseason_weight: 1.3
# exponential recency weighting half-life in seasons for final model training (default: none,
# i.e. unweighted; keep it equal to wf_recency_half_life_seasons)
# train_recency_half_life_seasons: 16
# early stopping rounds for Optuna tuning trials only (default: 50)
tune_early_stopping_rounds: 50
# transformed market features in final model training (default: automatic, on whenever market
# lines exist)
# market_transform: true
# number of newest weeks held out for calibration in final training (default: wf_calibration_weeks)
# train_calibration_weeks: 4

## Optuna hyperparameter tuning settings:
# whether to perform hyperparameter tuning before final model training (default: false)
tune: false
# Optuna tuning timeout in seconds (default: 600)
tune_timeout: 600
# number of cross-validation splits for Optuna tuning (default: 3)
tune_cv_splits: 3
# Optuna objective metric for hyperparameter tuning (options: margin_mae, total_mae, combined_mae,
# winner_accuracy, brier, expected_points, default: brier)
tune_objective: brier

## XGBoost runtime configuration:
# XGBoost tree method (default: automatic)
# xgb_tree_method: hist
# XGBoost device (default: the CPU; pass --xgb-device cuda for the GPU)
# xgb_device: cuda
# XGBoost threads for every stage (default: unset, so final training uses every CPU core and
# stage 1 uses wf_n_jobs)
# xgb_n_jobs: 12

## Prediction output settings:
# predict_path omitted so weekly_run picks the newest data/predict/week_XX_games_to_predict.csv.
# score rounding for displayed predictions; never changes probabilities or picks (options: none,
# int, half, nfl, default: none)
score_rounding: none
# ratings_min_season omitted so ratings can use the full available history by default.
# power_rankings_season and power_rankings_through_week are inferred from the prediction input.
# whether to include postseason games in power rankings (default: false)
power_rankings_include_postseason: false
