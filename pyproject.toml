[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "nfl-predictor"
version = "0.59.5"
description = "NFL game score and outcome prediction with a margin/total ML model, calibrated win probabilities, and tooling for Pick 'Em and Confidence Pools."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mitch Avis", email = "mitchavis@gmail.com" }]
keywords = ["stats", "sports", "football", "machine learning"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Private :: Do Not Upload",
]
dependencies = [
    "argon2-cffi>=25.1",
    "beautifulsoup4>=4.15",
    "coloredlogs>=15.0",
    "fastapi>=0.143",
    "joblib>=1.6",
    "lightgbm>=4.7",
    "lxml>=6.1",
    "nflreadpy>=0.1",
    "numpy>=2.5",
    "optuna>=5.0",
    "pandas>=3.0",
    "polars>=2.0",
    "pydantic-settings>=2.16",
    "pyjwt>=2.15",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "requests>=2.34",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "sse-starlette>=3.5",
    "threadpoolctl>=3.7",
    "uvicorn[standard]>=0.54",
    "xgboost>=3.4",
]

[project.scripts]
nfl-lightgbm-cuda-install = "nfl_predictor.lightgbm_cuda:main"
nfl-predictor = "nfl_predictor.cli.main:main"

[dependency-groups]
dev = [
    "httpx2>=2.13", # FastAPI's TestClient
    "pandas-stubs>=3.0",
    "pre-commit>=4.7",
    "pyright>=1.1.414",
    "pytest-cov>=7.1",
    "pytest-sugar>=1.1",
    "pytest-xdist>=3.8",
    "pytest>=9.1",
    "ruff>=0.17",
    "scikit-build-core>=1.1",
    "scipy-stubs>=1.18",
    "ty>=0.0.88",
]

[tool.uv]
required-version = ">=0.13"
no-build-isolation-package = ["lightgbm"]

# --------------------------------------------------------------------------------------------
# Ruff: format + lint (strict)
# --------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".agents", "build", "web"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
# The project logger, so rules that recognize logging calls (a blind `except` that logs the
# traceback with `log.exception`, for example) see it as one.
logger-objects = ["nfl_predictor.utils.logger.log"]
# The Greek sigma in user-facing text names the standard deviation on purpose.
allowed-confusables = ["σ"]
ignore = [
    "COM812", # Conflicts with `ruff format`, which owns trailing commas
    "CPY001", # The license is declared once in pyproject.toml, not per file
]

[tool.ruff.lint.isort]
known-first-party = ["nfl_predictor", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# FastAPI reads route signatures and pydantic reads model fields at runtime, so the types they
# name must stay real imports rather than moving under TYPE_CHECKING.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
runtime-evaluated-decorators = [
    "fastapi.APIRouter.delete",
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
]

# `pl.lit(True)` builds a literal from a value; the boolean is data, not a behavior flag.
[tool.ruff.lint.flake8-boolean-trap]
extend-allowed-calls = ["polars.lit"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the point of tests
    "S105",    # ignore hardcoded passwords in strings in tests
    "S106",    # ignore hardcoded passwords in function arguments in tests
    "S603",    # runs the repository's own update_requirements.sh functions under bash with stubbed tools
    "PLR2004", # magic numbers in expectations are fine
    "D",       # test names document themselves
    "ANN",     # fixtures/params don't need annotations everywhere
    "SLF001",  # tests may poke private helpers
    "INP001",  # tests/ sits on pytest's pythonpath as a plain directory, not a package
    "ARG001",  # fixtures requested for their side effects; stubs keep the replaced signature
    "ARG005",  # monkeypatched lambdas keep the signature of the function they replace
    "DTZ001",  # test data uses naive datetimes, like the schedule dates it stands in for
    "PLC0415", # an import used by a single test stays local to that test
]
# Genuine false positives, each reviewed; the reason sits beside the rule.
"src/nfl_predictor/api/registry/*.py" = [
    "E501", # one column definition per line, descriptions included
]
"src/nfl_predictor/api/jobs/runner.py" = [
    "S603", # a job's argv is built from the vetted template catalog, never from raw input
]
"src/nfl_predictor/lightgbm_cuda.py" = [
    "S603",   # fixed tool names with repo-controlled arguments
    "TRY400", # an install failure is reported as a message; the traceback adds nothing
]
"src/nfl_predictor/ml/artifacts.py" = [
    "S607", # `git` from PATH, the same git the checkout was made with
]
"src/nfl_predictor/ml/walk_forward.py" = [
    "S607",   # `git` from PATH, the same git the checkout was made with
    "NPY002", # the legacy global seed stays until a walk-forward shows nothing reads it
]
"src/nfl_predictor/cli/compare.py" = [
    "TRY400", # a bad run argument is reported as a message with exit code 2, no traceback
]
"src/nfl_predictor/weekly_run/__main__.py" = [
    "PLC0415", # the OpenMP wait policy must be set before the pipeline imports XGBoost
]
"src/nfl_predictor/api/auth/cli.py" = [
    "S105", # PASSWORD_ENV holds the name of an environment variable, not a password
]
"typings/joblib.pyi" = [
    "ANN401", # joblib.load unpickles an object of any type, as typeshed types pickle.load
]
"typings/sklearn/*.pyi" = [
    "N803", # sklearn names its data argument `X`; the stub keeps the keyword callers can pass
]
"typings/threadpoolctl.pyi" = [
    "N801", # the stub keeps the library's own lowercase class name, threadpool_limits
]

# --------------------------------------------------------------------------------------------
# Type checking: ty and pyright (strict)
# --------------------------------------------------------------------------------------------
[tool.ty.environment]
# Pin ty to the repo venv so local and CI checks resolve the same interpreter.
python = ".venv"

[tool.ty.src]
include = ["src", "tests"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]           # keeps `tests.*` imports resolving from the repo root
reportPrivateUsage = false   # unit tests import their own module's private helpers

# --------------------------------------------------------------------------------------------
# Tests and coverage
# --------------------------------------------------------------------------------------------
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
# Tests import shared helpers as `tests.*`; the package itself is imported from src/ via the
# editable install, so bare `pytest` and `python -m pytest` resolve the same modules.
pythonpath = ["."]
# strict_config, strict_markers, strict_xfail and strict_parametrization_ids.
strict = true
addopts = [
    "-ra",                       # show extra summary for (s)kipped, (x)failed
    "-n=auto",                   # pytest-xdist: one worker per core; `-n 0` runs in-process
    "--cov",                     # measure the paths in [tool.coverage.run] source
    "--cov-report=term-missing",
]
# Every warning fails the test that raised it; a third-party warning that can't be fixed here
# gets its own narrow "ignore:<message>:<category>" entry with the reason beside it.
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src", "tests"]

[tool.coverage.report]
# scripts/gate.sh also holds src/ alone to this bar, since tests/ lifts the total.
fail_under = 90
show_missing = true
skip_empty = true
exclude_also = ["if __name__ == \"__main__\":", "if TYPE_CHECKING:"]
