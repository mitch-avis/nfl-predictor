[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nfl-predictor"
dynamic = ["version"]
description = "Eventually, something useful for predicting football games"
readme = "README.md"
requires-python = ">=3.13"
keywords = ["stats", "sports", "football", "machine learning"]
authors = [{ name = "Mitch Avis", email = "mitchavis@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4",
    "coloredlogs",
    "joblib",
    "lxml",
    "nflreadpy",
    "numpy",
    "optuna",
    "openpyxl",
    "pandas",
    "polars",
    "requests",
    "scikit-learn",
    "scipy",
    "xgboost",
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/mitch-avis/nfl-predictor"

[tool.hatch.build.targets.wheel]
packages = ["nfl_predictor"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
lint.select = ["E", "F", "W", "I", "B"]
lint.ignore = [
    "E203", # space before ':' (conflicts with black)
]
extend-exclude = [
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "build",
    "dist",
]

[tool.ruff.lint.isort]
known-first-party = ["nfl_predictor"]
known-third-party = ["__main__"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "-ra",                       # show extra summary for (s)kipped, (x)failed
    "--strict-markers",
    "--cov=nfl_predictor",
    "--cov-report=term-missing",
]
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["nfl_predictor"]
omit = ["config.py", "config-*.py", "*/config.py", "*/config-*.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
