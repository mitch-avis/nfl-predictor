[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "nfl-predictor"
version = "0.39.0"
description = "NFL game score and outcome prediction with a margin/total ML model, calibrated win probabilities, and tooling for Pick 'Em and Confidence Pools."
keywords = ["stats", "sports", "football", "machine learning"]
readme = "README.md"
authors = [{ name = "Mitch Avis", email = "mitchavis@gmail.com" }]
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "argon2-cffi>=25.1",
    "beautifulsoup4>=4.15",
    "coloredlogs>=15.0",
    "fastapi>=0.142",
    "joblib>=1.6",
    "lightgbm>=4.7",
    "lxml>=6.1",
    "nflreadpy>=0.1",
    "numpy>=2.5",
    "optuna>=5.0",
    "pandas>=3.0",
    "polars>=1.44",
    "pydantic-settings>=2.15",
    "pyjwt>=2.15",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "requests>=2.34",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "sse-starlette>=3.5",
    "uvicorn[standard]>=0.54",
    "xgboost>=3.4",
]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
nfl-lightgbm-cuda-install = "nfl_predictor.lightgbm_cuda:main"
nfl-predictor = "nfl_predictor.cli.main:main"

[project.urls]
Homepage = "https://github.com/mitch-avis/nfl-predictor"

[dependency-groups]
dev = [
    "colorama>=0.4",
    "httpx2>=2.13",
    "pandas-stubs>=3.0",
    "pre-commit>=4.6",
    "pyright>=1.1",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-html>=4.2",
    "pytest-metadata>=3.1",
    "pytest-sugar>=1.1",
    "pytest-xdist>=3.8",
    "ruff>=0.16",
    "scikit-build-core>=1.1",
    "ty>=0.0.84",
]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.12"
no-build-isolation-package = ["lightgbm"]

[tool.uv.extra-build-dependencies]
lightgbm = ["scikit-build-core"]

# --------------------------------------------------------------------------------------------
# Ruff: format + lint (strict)
# --------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = [
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "build",
    "dist",
    "web",
    # Audit scripts under .agents/ are frozen records whose output the docs quote, so they
    # stay as they ran rather than being rewritten to the current lint rules.
    ".agents",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["nfl_predictor"]

[tool.ruff.lint]
select = ["ALL"]
# The project logger, so rules that recognize logging calls (a blind `except` that logs the
# traceback with `log.exception`, for example) see it as one.
logger-objects = ["nfl_predictor.utils.logger.log"]
# The Greek sigma in user-facing text names the standard deviation on purpose.
allowed-confusables = ["σ"]
ignore = [
    "D203",   # Conflicts with D211 (no-blank-line-before-class)
    "D213",   # Conflicts with D212 (multi-line-summary-first-line)
    "COM812", # Conflicts with `ruff format`, which owns trailing commas
    "ISC001", # Conflicts with `ruff format`, which joins implicit concatenations
    "CPY001", # The license is declared once in pyproject.toml, not per file
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# FastAPI reads route signatures and pydantic reads model fields at runtime, so the types they
# name must stay real imports rather than moving under TYPE_CHECKING.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
runtime-evaluated-decorators = [
    "fastapi.APIRouter.delete",
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
]

# `pl.lit(True)` builds a literal from a value; the boolean is data, not a behavior flag.
[tool.ruff.lint.flake8-boolean-trap]
extend-allowed-calls = ["polars.lit"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the point of tests
    "S105",    # ignore hardcoded passwords in strings in tests
    "S106",    # ignore hardcoded passwords in function arguments in tests
    "PLR2004", # magic numbers in expectations are fine
    "D",       # test names document themselves
    "ANN",     # fixtures/params don't need annotations everywhere
    "SLF001",  # tests may poke private helpers
    "INP001",
    "ARG001",
    "ARG002",
    "ARG005",
    "DTZ001",  # EXIF timestamps are naive by definition
    "PLC0415",
]
# Genuine false positives, each reviewed; the reason sits beside the rule.
"src/nfl_predictor/api/registry/*.py" = [
    "E501", # one column definition per line, descriptions included
]
"src/nfl_predictor/api/jobs/runner.py" = [
    "S603", # a job's argv is built from the vetted template catalog, never from raw input
]
"src/nfl_predictor/lightgbm_cuda.py" = [
    "S603",   # fixed tool names with repo-controlled arguments
    "TRY400", # an install failure is reported as a message; the traceback adds nothing
]
"src/nfl_predictor/ml/artifacts.py" = [
    "S607", # `git` from PATH, the same git the checkout was made with
]
"src/nfl_predictor/ml/walk_forward.py" = [
    "S607",   # `git` from PATH, the same git the checkout was made with
    "NPY002", # the legacy global seed stays until a walk-forward shows nothing reads it
]
"src/nfl_predictor/cli/compare.py" = [
    "TRY400", # a bad run argument is reported as a message with exit code 2, no traceback
]
"src/nfl_predictor/weekly_run/__main__.py" = [
    "PLC0415", # the OpenMP wait policy must be set before the pipeline imports XGBoost
]
"src/nfl_predictor/api/auth/cli.py" = [
    "S105", # PASSWORD_ENV holds the name of an environment variable, not a password
]

[tool.ty.environment]
# Pin ty to the repo venv so local and CI checks resolve the same interpreter.
python = ".venv"
python-version = "3.14"

[tool.ty.src]
# Limit ty to the checked-in source roots we validate in CI.
include = ["src", "scripts", "tests"]

[tool.pyright]
pythonVersion = "3.14"
# Keep pyright on the repo's stable standard-mode baseline, then promote the specific diagnostics we
# rely on in CI and Pylance.
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
pythonPlatform = "Linux"
stubPath = "stubs"
executionEnvironments = [{ root = "." }]
exclude = [
    "**/__pycache__",
    "**/.*",
    ".venv",
    "**/node_modules",
    # `nfl-sos-ratings` is a gitignored symlink to the read-only reference repo; it is not part
    # of this project's type-check surface. `models/` holds gitignored run directories whose review
    # scripts are frozen records of the code they ran against, so CI never sees them either. The
    # rest of the list restores pyright's defaults.
    "nfl-sos-ratings",
    "models",
    "web",
]
# --- Standard-mode diagnostics promoted to errors (also surfaced by Pylance) ----------
reportMissingImports = "error"
reportMissingModuleSource = "warning"
reportAttributeAccessIssue = "error"
reportAssignmentType = "error"
reportArgumentType = "error"
reportReturnType = "error"
reportCallIssue = "error"
reportIndexIssue = "error"
reportOperatorIssue = "error"
reportOptionalSubscript = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
reportGeneralTypeIssues = "error"
reportMissingTypeStubs = false
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# Tests import shared helpers as `tests.*`; the package itself is imported from src/ via the
# editable install, so bare `pytest` and `python -m pytest` resolve the same modules.
pythonpath = ["."]
addopts = [
    "-ra",                       # show extra summary for (s)kipped, (x)failed
    "--strict-markers",
    "--cov=nfl_predictor",
    "--cov-report=term-missing",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["nfl_predictor"]
omit = ["config.py", "config-*.py", "*/config.py", "*/config-*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__ == \"__main__\":"]
